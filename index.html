<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>COVA 到府安裝簽收單</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'PingFang TC', 'Noto Sans TC', sans-serif;
      font-size: 14px;
      background: #f5f5f7;
      color: #1d1d1f;
    }
    .page {
      max-width: 480px;
      margin: 0 auto;
      background: #fff;
      min-height: 100vh;
      padding: 1.2rem 1rem 2rem;
    }

    /* Header */
    .brand {
      text-align: center;
      padding: 14px 0 12px;
      border-bottom: 2px solid #1d1d1f;
      margin-bottom: 14px;
    }
    .brand h1 { font-size: 17px; font-weight: 600; letter-spacing: 3px; }
    .brand p { font-size: 11px; color: #6e6e73; margin-top: 3px; letter-spacing: 1px; }

    /* Info grid */
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid #d1d1d6;
      margin-bottom: 14px;
    }
    .info-cell {
      padding: 6px 8px;
      border: 0.5px solid #e5e5ea;
    }
    .info-cell.wide { grid-column: span 2; }
    .info-cell label {
      display: block;
      font-size: 10px;
      color: #8e8e93;
      margin-bottom: 2px;
      font-weight: 500;
    }
    .info-cell .val {
      font-size: 13px;
      color: #1d1d1f;
      font-weight: 400;
    }
    .info-cell input {
      font-size: 13px;
      color: #1d1d1f;
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      font-family: inherit;
    }
    .info-cell input::placeholder { color: #c7c7cc; }

    /* Section title */
    .section-title {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: #8e8e93;
      text-transform: uppercase;
      margin: 14px 0 6px;
    }

    /* Detail table */
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th {
      background: #f2f2f7;
      padding: 6px 4px;
      text-align: center;
      font-weight: 600;
      font-size: 11px;
      border: 0.5px solid #d1d1d6;
      color: #3a3a3c;
    }
    td {
      padding: 4px 3px;
      border: 0.5px solid #e5e5ea;
      text-align: center;
      vertical-align: middle;
    }
    td input {
      width: 100%;
      border: none;
      background: transparent;
      text-align: center;
      font-size: 12px;
      font-family: inherit;
      outline: none;
      color: #1d1d1f;
      padding: 2px 0;
    }
    td.name-cell input { text-align: left; padding-left: 4px; }
    td input[readonly] { color: #6e6e73; }
    .del-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #8e8e93;
      font-size: 16px;
      line-height: 1;
      padding: 2px;
    }
    .del-btn:hover { color: #ff3b30; }
    .total-row td {
      font-weight: 600;
      background: #f2f2f7;
      font-size: 12px;
    }
    .add-row-btn {
      width: 100%;
      padding: 8px;
      background: #f2f2f7;
      border: 1px dashed #c7c7cc;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      color: #6e6e73;
      margin-top: 6px;
      font-family: inherit;
    }
    .add-row-btn:hover { background: #e5e5ea; }

    /* Remark */
    .remark-area {
      width: 100%;
      border: 1px solid #d1d1d6;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 13px;
      font-family: inherit;
      resize: vertical;
      min-height: 64px;
      outline: none;
      color: #1d1d1f;
      background: #fff;
    }

    /* Signature */
    .sig-box {
      border: 1px solid #d1d1d6;
      border-radius: 6px;
      background: #fafafa;
      position: relative;
      height: 140px;
      overflow: hidden;
    }
    .sig-box canvas {
      display: block;
      width: 100%;
      height: 140px;
      touch-action: none;
      cursor: crosshair;
    }
    .sig-hint {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 12px;
      color: #c7c7cc;
      pointer-events: none;
      white-space: nowrap;
    }
    .sig-clear {
      position: absolute;
      top: 8px;
      right: 10px;
      font-size: 11px;
      color: #8e8e93;
      background: none;
      border: none;
      cursor: pointer;
      text-decoration: underline;
      font-family: inherit;
    }
    .sig-label {
      font-size: 11px;
      color: #6e6e73;
      margin-bottom: 6px;
    }

    /* Footer info */
    .footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 10px 0 18px;
      font-size: 12px;
      color: #6e6e73;
    }
    .footer-row input {
      border: none;
      border-bottom: 1px solid #d1d1d6;
      background: transparent;
      width: 90px;
      font-size: 12px;
      outline: none;
      font-family: inherit;
      color: #1d1d1f;
      padding-bottom: 1px;
    }

    /* Submit button */
    .submit-btn {
      width: 100%;
      padding: 14px;
      background: #1d1d1f;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 0.5px;
    }
    .submit-btn:active { transform: scale(0.98); opacity: 0.9; }
    .submit-btn:disabled { background: #8e8e93; cursor: not-allowed; }

    /* Loading overlay */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 100;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
    }
    .overlay.show { display: flex; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .overlay p { color: #fff; font-size: 14px; }

    /* Success screen */
    .success-view {
      display: none;
      text-align: center;
      padding: 4rem 1.5rem;
    }
    .check-icon {
      width: 64px; height: 64px;
      background: #34c759;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 32px;
      color: #fff;
    }
    .success-view h2 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
    .success-view p { font-size: 14px; color: #6e6e73; line-height: 1.6; }
    .next-btn {
      margin-top: 2rem;
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d1d6;
      border-radius: 10px;
      background: none;
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
      color: #1d1d1f;
    }

    /* Error message */
    .error-msg {
      display: none;
      background: #fff2f2;
      border: 1px solid #ffb3b3;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 13px;
      color: #ff3b30;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

<div class="overlay" id="overlay">
  <div class="spinner"></div>
  <p>正在產出 PDF 並寄送...</p>
</div>

<div class="page">

  <!-- 表單頁 -->
  <div id="form-view">
    <div class="brand">
      <h1>COVA</h1>
      <p>到府安裝完工簽收單</p>
    </div>

    <!-- 客戶資訊（Notion 帶入） -->
    <div class="info-grid" id="info-grid">
      <div class="info-cell">
        <label>客戶</label>
        <span class="val" id="f-customer">—</span>
      </div>
      <div class="info-cell">
        <label>聯絡人</label>
        <span class="val" id="f-contact">—</span>
      </div>
      <div class="info-cell wide">
        <label>地址</label>
        <span class="val" id="f-address">—</span>
      </div>
      <div class="info-cell">
        <label>手機</label>
        <span class="val" id="f-phone">—</span>
      </div>
      <div class="info-cell">
        <label>電子郵件</label>
        <span class="val" id="f-email">—</span>
      </div>
      <div class="info-cell">
        <label>服務單號</label>
        <span class="val" id="f-svcno">—</span>
      </div>
      <div class="info-cell">
        <label>到府時間</label>
        <span class="val" id="f-visit">—</span>
      </div>
      <div class="info-cell">
        <label>廠牌</label>
        <span class="val" id="f-brand">—</span>
      </div>
      <div class="info-cell">
        <label>料號</label>
        <span class="val" id="f-model">—</span>
      </div>
      <div class="info-cell">
        <label>產品類型</label>
        <span class="val" id="f-ptype">—</span>
      </div>
      <div class="info-cell wide">
        <label>服務項目</label>
        <span class="val" id="f-stype">—</span>
      </div>
    </div>

    <!-- 服務明細 -->
    <div class="section-title">服務明細</div>
    <table id="detail-table">
      <thead>
        <tr>
          <th style="width:24px">序</th>
          <th>服務項目</th>
          <th style="width:56px">材料費</th>
          <th style="width:46px">工資</th>
          <th style="width:38px">數量</th>
          <th style="width:54px">小計</th>
          <th style="width:26px"></th>
        </tr>
      </thead>
      <tbody id="detail-body"></tbody>
      <tfoot>
        <tr class="total-row">
          <td colspan="5" style="text-align:right;padding-right:10px;font-size:12px">總計（含稅）</td>
          <td id="total-cell">0</td>
          <td></td>
        </tr>
      </tfoot>
    </table>
    <button class="add-row-btn" onclick="addRow()">＋ 新增項目</button>

    <!-- 備註 -->
    <div class="section-title">備註事項</div>
    <textarea class="remark-area" id="remark" placeholder="若有其他備註事項，請輸入"></textarea>

    <!-- 簽名 -->
    <div class="section-title">客戶簽名</div>
    <div class="sig-label">本人同意電子簽署的效力比照紙本</div>
    <div class="sig-box">
      <canvas id="sigCanvas"></canvas>
      <span class="sig-hint" id="sig-hint">請用手指在此簽名</span>
      <button class="sig-clear" onclick="clearSig()">清除</button>
    </div>

    <!-- 師傅 & 日期 -->
    <div class="footer-row">
      <span>安裝師傅：<input id="tech-name" placeholder="姓名" autocomplete="off"></span>
      <span id="today-str"></span>
    </div>

    <!-- 錯誤訊息 -->
    <div class="error-msg" id="error-msg"></div>

    <button class="submit-btn" id="submit-btn" onclick="submitForm()">
      確認簽收並寄送 PDF
    </button>
  </div>

  <!-- 完成頁 -->
  <div class="success-view" id="success-view">
    <div class="check-icon">✓</div>
    <h2>簽收完成</h2>
    <p id="success-info"></p>
    <p style="margin-top:6px;font-size:12px;color:#8e8e93">PDF 已自動寄送至公司信箱</p>
    <button class="next-btn" onclick="resetForm()">下一筆案件</button>
  </div>

</div>

<script>
// =============================================
// ① 請將下方 GAS_URL 換成你的 Google Apps Script 部署網址
// ② 請將 COMPANY_EMAIL 換成公司收件信箱
// =============================================
const GAS_URL = "https://script.google.com/macros/s/AKfycbzVxWwla3jrXHJWun-w1JD0duFUuXeu-lagDT-x_i6abWHojP0dfl3xUPSXco8amKtG2A/exec";
const COMPANY_EMAIL = "your@email.com"; // 僅供前端顯示用，實際收件在 GAS 設定

// =============================================
// 從網址參數讀取 Notion 帶入的資料
// 範例網址：index.html?customer=王小明&contact=王小明&phone=0912345678
//           &email=test@gmail.com&address=台中市...&svcno=BSH001
//           &visit=2025/09/25&brand=BOSCH&model=SPS2IKI06X
//           &ptype=洗碗機_獨立式&stype=1-1.基本安裝
// =============================================
function getParam(key) {
  const p = new URLSearchParams(window.location.search);
  return p.get(key) || "—";
}

function loadCaseInfo() {
  const fields = {
    "f-customer": "customer",
    "f-contact":  "contact",
    "f-address":  "address",
    "f-phone":    "phone",
    "f-email":    "email",
    "f-svcno":    "svcno",
    "f-visit":    "visit",
    "f-brand":    "brand",
    "f-model":    "model",
    "f-ptype":    "ptype",
    "f-stype":    "stype",
  };
  for (const [id, param] of Object.entries(fields)) {
    const el = document.getElementById(id);
    if (el) el.textContent = getParam(param);
  }
}

// =============================================
// 日期
// =============================================
const today = new Date();
const todayStr = today.getFullYear() + " 年 " +
  String(today.getMonth()+1).padStart(2,'0') + " 月 " +
  String(today.getDate()).padStart(2,'0') + " 日";
document.getElementById("today-str").textContent = todayStr;

// =============================================
// 服務明細
// =============================================
let rowIdx = 0;

function addRow(data) {
  rowIdx++;
  const d = data || { name:"", mat:0, labor:0, qty:1 };
  const sub = (parseFloat(d.mat)||0 + parseFloat(d.labor)||0) * (parseFloat(d.qty)||1);
  const tr = document.createElement("tr");
  tr.innerHTML = `
    <td>${rowIdx}</td>
    <td class="name-cell"><input class="nm" value="${d.name}" placeholder="項目名稱"></td>
    <td><input class="mat" type="number" value="${d.mat}" min="0" inputmode="numeric"></td>
    <td><input class="labor" type="number" value="${d.labor}" min="0" inputmode="numeric"></td>
    <td><input class="qty" type="number" value="${d.qty}" min="1" inputmode="numeric"></td>
    <td><input class="sub" type="number" value="${sub}" readonly></td>
    <td><button class="del-btn" onclick="this.closest('tr').remove();calcTotal()">×</button></td>`;
  ["mat","labor","qty"].forEach(cls => {
    tr.querySelector("."+cls).addEventListener("input", () => calcRow(tr));
  });
  document.getElementById("detail-body").appendChild(tr);
  calcTotal();
}

function calcRow(tr) {
  const mat = parseFloat(tr.querySelector(".mat").value)||0;
  const labor = parseFloat(tr.querySelector(".labor").value)||0;
  const qty = parseFloat(tr.querySelector(".qty").value)||1;
  tr.querySelector(".sub").value = (mat + labor) * qty;
  calcTotal();
}

function calcTotal() {
  let total = 0;
  document.querySelectorAll("#detail-body tr").forEach(tr => {
    total += parseFloat(tr.querySelector(".sub").value)||0;
  });
  document.getElementById("total-cell").textContent = total;
}

// 預設一筆空白項目
addRow({ name:"", mat:0, labor:0, qty:1 });

// =============================================
// 簽名畫布
// =============================================
const canvas = document.getElementById("sigCanvas");
const ctx = canvas.getContext("2d");
let hasSig = false;
let drawing = false;

function resizeCanvas() {
  const box = canvas.parentElement;
  canvas.width = box.clientWidth;
  canvas.height = 140;
  ctx.strokeStyle = "#1a3fbf";
  ctx.lineWidth = 2.5;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

function getPos(e) {
  const r = canvas.getBoundingClientRect();
  const scaleX = canvas.width / r.width;
  const scaleY = canvas.height / r.height;
  const s = e.touches ? e.touches[0] : e;
  return { x:(s.clientX-r.left)*scaleX, y:(s.clientY-r.top)*scaleY };
}

canvas.addEventListener("mousedown", e => { drawing=true; const p=getPos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); });
canvas.addEventListener("mousemove", e => { if(!drawing) return; const p=getPos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); markSig(); });
canvas.addEventListener("mouseup", ()=>drawing=false);
canvas.addEventListener("touchstart", e=>{ e.preventDefault(); drawing=true; const p=getPos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); },{passive:false});
canvas.addEventListener("touchmove", e=>{ e.preventDefault(); if(!drawing) return; const p=getPos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); markSig(); },{passive:false});
canvas.addEventListener("touchend", ()=>drawing=false);

function markSig() { hasSig=true; document.getElementById("sig-hint").style.display="none"; }
function clearSig() { ctx.clearRect(0,0,canvas.width,canvas.height); hasSig=false; document.getElementById("sig-hint").style.display="block"; }

// =============================================
// 顯示 / 隱藏錯誤訊息
// =============================================
function showError(msg) {
  const el = document.getElementById("error-msg");
  el.textContent = msg;
  el.style.display = "block";
}
function hideError() {
  document.getElementById("error-msg").style.display = "none";
}

// =============================================
// 產出 PDF（純前端，使用 jsPDF）
// =============================================
function buildPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:"mm", format:"a4" });
  const W = 210, marginL = 14, marginR = 14, contentW = W - marginL - marginR;
  let y = 14;

  // 標題
  doc.setFont("helvetica","bold");
  doc.setFontSize(16);
  doc.text("COVA", W/2, y, {align:"center"});
  y += 7;
  doc.setFontSize(10);
  doc.setFont("helvetica","normal");
  doc.text("Installation Completion Receipt", W/2, y, {align:"center"});
  y += 5;
  doc.setDrawColor(29,29,31);
  doc.setLineWidth(0.5);
  doc.line(marginL, y, W-marginR, y);
  y += 7;

  // 客戶資訊
  const fields = [
    ["客戶", id("f-customer")], ["聯絡人", id("f-contact")],
    ["地址", id("f-address")],  ["手機", id("f-phone")],
    ["電子郵件", id("f-email")],["服務單號", id("f-svcno")],
    ["到府時間", id("f-visit")], ["廠牌", id("f-brand")],
    ["料號", id("f-model")],    ["產品類型", id("f-ptype")],
    ["服務項目", id("f-stype")],
  ];

  doc.setFontSize(8);
  const cellH = 7, halfW = contentW/2;
  let col = 0;
  doc.setDrawColor(180,180,186);
  doc.setLineWidth(0.3);

  fields.forEach((f, i) => {
    const isWide = (f[0] === "地址" || f[0] === "服務項目");
    const cW = isWide ? contentW : halfW;
    const x = marginL + (col === 1 ? halfW : 0);

    doc.setFillColor(242,242,247);
    doc.rect(x, y, cW, cellH, "FD");
    doc.setTextColor(100,100,110);
    doc.setFont("helvetica","bold");
    doc.text(f[0], x+2, y+4.5);

    doc.setFillColor(255,255,255);
    doc.rect(x, y+cellH, cW, cellH, "FD");
    doc.setTextColor(29,29,31);
    doc.setFont("helvetica","normal");
    doc.text(String(f[1]).substring(0,40), x+2, y+cellH+4.5);

    if (isWide) { y += cellH*2; col = 0; }
    else {
      if (col === 0) col = 1;
      else { y += cellH*2; col = 0; }
    }
  });
  if (col === 1) y += cellH*2;
  y += 4;

  // 明細表
  doc.setFontSize(8);
  doc.setFont("helvetica","bold");
  doc.text("服務明細", marginL, y);
  y += 4;

  const cols = [10, 60, 22, 22, 18, 24];
  const headers = ["序","服務項目","材料費","工資","數量","小計"];
  let x2 = marginL;
  doc.setFillColor(242,242,247);
  cols.forEach((w,i) => {
    doc.rect(x2, y, w, 7, "FD");
    doc.setTextColor(58,58,60);
    doc.text(headers[i], x2 + w/2, y+4.8, {align:"center"});
    x2 += w;
  });
  y += 7;

  document.querySelectorAll("#detail-body tr").forEach((tr, idx) => {
    const cells = [
      String(idx+1),
      tr.querySelector(".nm").value || "—",
      tr.querySelector(".mat").value || "0",
      tr.querySelector(".labor").value || "0",
      tr.querySelector(".qty").value || "1",
      tr.querySelector(".sub").value || "0",
    ];
    x2 = marginL;
    doc.setFillColor(255,255,255);
    doc.setTextColor(29,29,31);
    doc.setFont("helvetica","normal");
    cols.forEach((w,i) => {
      doc.rect(x2, y, w, 7, "FD");
      const txt = cells[i].substring(0,30);
      doc.text(txt, x2 + w/2, y+4.8, {align:"center"});
      x2 += w;
    });
    y += 7;
  });

  // 合計
  x2 = marginL;
  doc.setFillColor(242,242,247);
  doc.setFont("helvetica","bold");
  const totalColW = cols.slice(0,-1).reduce((a,b)=>a+b,0);
  doc.rect(marginL, y, totalColW, 7, "FD");
  doc.text("總計（含稅）", marginL + totalColW - 2, y+4.8, {align:"right"});
  doc.rect(marginL+totalColW, y, cols[5], 7, "FD");
  doc.text(String(document.getElementById("total-cell").textContent), marginL+totalColW+cols[5]/2, y+4.8, {align:"center"});
  y += 12;

  // 備註
  const remark = document.getElementById("remark").value;
  if (remark.trim()) {
    doc.setFont("helvetica","bold").setFontSize(8).setTextColor(100,100,110);
    doc.text("備註事項", marginL, y);
    y += 5;
    doc.setFont("helvetica","normal").setTextColor(29,29,31);
    const lines = doc.splitTextToSize(remark, contentW);
    doc.text(lines, marginL, y);
    y += lines.length * 5 + 4;
  }

  // 簽名
  doc.setFont("helvetica","bold").setFontSize(8).setTextColor(100,100,110);
  doc.text("客戶簽名（本人同意電子簽署的效力比照紙本）", marginL, y);
  y += 5;
  const sigData = canvas.toDataURL("image/png");
  doc.addImage(sigData, "PNG", marginL, y, 80, 30);
  y += 35;

  // 師傅 & 日期
  doc.setFont("helvetica","normal").setFontSize(9).setTextColor(29,29,31);
  const tech = document.getElementById("tech-name").value || "—";
  doc.text("安裝師傅：" + tech, marginL, y);
  doc.text(todayStr, W-marginR, y, {align:"right"});

  return doc;
}

function id(elId) {
  return document.getElementById(elId)?.textContent?.trim() || "—";
}

// =============================================
// 送出表單
// =============================================
async function submitForm() {
  hideError();

  if (!hasSig) { showError("請讓客戶完成簽名後再送出"); return; }
  const tech = document.getElementById("tech-name").value.trim();
  if (!tech) { showError("請填寫安裝師傅姓名"); return; }

  const btn = document.getElementById("submit-btn");
  btn.disabled = true;
  document.getElementById("overlay").classList.add("show");

  try {
    const pdfDoc = buildPDF();
    const pdfBase64 = pdfDoc.output("datauristring").split(",")[1];

    const svcno = id("f-svcno");
    const customer = id("f-customer");

    const payload = {
      pdfBase64,
      filename: `COVA_簽收單_${svcno}_${customer}_${todayStr.replace(/ /g,"")}.pdf`,
      svcno,
      customer,
      tech,
      date: todayStr,
      total: document.getElementById("total-cell").textContent,
    };

    const resp = await fetch(GAS_URL, {
      method: "POST",
      body: JSON.stringify(payload),
    });
    const result = await resp.json();

    if (result.status === "ok") {
      document.getElementById("form-view").style.display = "none";
      document.getElementById("success-view").style.display = "block";
      document.getElementById("success-info").textContent =
        `服務單號 ${svcno}｜${customer}｜總計 NT$ ${payload.total}`;
    } else {
      throw new Error(result.message || "寄送失敗");
    }
  } catch(e) {
    showError("寄送失敗，請檢查網路或聯絡管理員。（" + e.message + "）");
  } finally {
    btn.disabled = false;
    document.getElementById("overlay").classList.remove("show");
  }
}

function resetForm() {
  document.getElementById("form-view").style.display = "block";
  document.getElementById("success-view").style.display = "none";
  clearSig();
  document.getElementById("tech-name").value = "";
  document.getElementById("remark").value = "";
  document.getElementById("detail-body").innerHTML = "";
  rowIdx = 0;
  addRow({ name:"", mat:0, labor:0, qty:1 });
  hideError();
  window.scrollTo(0,0);
}

// 初始化
loadCaseInfo();
</script>
